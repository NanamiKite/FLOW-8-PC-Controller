name: Rust

on:
  push:
  pull_request:

# The workspace currently uses a sibling path dependency on the independent
# DirectHCI SDK. Configure DIRECTHCI_REPOSITORY (owner/repo) to enable CI.
jobs:
  linux:
    if: vars.DIRECTHCI_REPOSITORY != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: flow8
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DIRECTHCI_REPOSITORY }}
          token: ${{ secrets.DIRECTHCI_READ_TOKEN || github.token }}
          path: DirectHCI
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev
      - name: Rust validation
        working-directory: flow8
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/flow8-target
        run: |
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace
          cargo build --workspace

  windows:
    if: vars.DIRECTHCI_REPOSITORY != ''
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: flow8
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DIRECTHCI_REPOSITORY }}
          token: ${{ secrets.DIRECTHCI_READ_TOKEN || github.token }}
          path: DirectHCI
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust validation
        working-directory: flow8
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/flow8-target
        run: |
          cargo check --workspace
          cargo test --workspace
          cargo build --workspace
